services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitask}
      POSTGRES_USER: ${POSTGRES_USER:-aitask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitask_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitask} -d ${POSTGRES_DB:-aitask}"]
      interval: 10s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.1
    restart: unless-stopped
    command:
      - "--logtostderr"
      - "--requirepass=${DRAGONFLY_PASSWORD:-dragonfly_dev_password}"
    ulimits:
      memlock: -1
    ports:
      - "${DRAGONFLY_PORT:-6379}:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DRAGONFLY_PASSWORD:-dragonfly_dev_password} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AITASK_ENV: ${AITASK_ENV:-development}
      AITASK_HTTP_HOST: ${AITASK_HTTP_HOST:-0.0.0.0}
      AITASK_HTTP_PORT: ${AITASK_HTTP_PORT:-8080}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-aitask}
      POSTGRES_USER: ${POSTGRES_USER:-aitask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitask_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgres://aitask:aitask_dev_password@postgres:5432/aitask?sslmode=disable}
      DRAGONFLY_HOST: ${DRAGONFLY_HOST:-dragonfly}
      DRAGONFLY_PORT: ${DRAGONFLY_PORT:-6379}
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:-dragonfly_dev_password}
      DRAGONFLY_URL: ${DRAGONFLY_URL:-redis://:dragonfly_dev_password@dragonfly:6379/0}
      OPENVIKING_NAMESPACE: ${OPENVIKING_NAMESPACE:-aitask}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-dev_only_change_me}
      CONSOLE_OPERATOR_LABEL: ${CONSOLE_OPERATOR_LABEL:-local-operator}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: aitask-web:latest
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  openviking:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: aitask-openviking:latest
    environment:
      OPENVIKING_HOST: 0.0.0.0
      OPENVIKING_PORT: 9090
      OPENVIKING_DATA_DIR: /data
    restart: unless-stopped
    entrypoint: ["/app/aitask-openviking"]
    ports:
      - "${OPENVIKING_PORT:-19090}:9090"
    volumes:
      - openviking_data:/data
    healthcheck:
      test: ["CMD", "/app/aitask-openviking", "--healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dragonfly_data:
  openviking_data:
